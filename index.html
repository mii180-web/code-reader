<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Reader</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
<style>
  :root {
    --bg:#f3f3f3;--surface:rgba(255,255,255,0.88);--surface2:rgba(255,255,255,0.55);
    --border:rgba(0,0,0,0.09);--text:#1a1a1a;--text2:#666;
    --accent:#0078d4;--green:#107c10;--danger:#d13438;--radius:12px;
  }
  @media(prefers-color-scheme:dark){
    :root{--bg:#1c1c1c;--surface:rgba(36,36,36,0.92);--surface2:rgba(50,50,50,0.7);
    --border:rgba(255,255,255,0.09);--text:#f3f3f3;--text2:#999;--accent:#60cdff;--green:#6ccb5f;}
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
  header{background:var(--surface);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
  header h1{font-size:1.1rem;font-weight:600;}
  main{flex:1;padding:20px;max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  .card{background:var(--surface);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden;}
  .card-header{padding:12px 18px;font-size:0.82rem;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);}

  #cam-wrap{position:relative;background:#000;aspect-ratio:16/9;}
  #video{width:100%;height:100%;object-fit:cover;display:block;}
  #canvas{display:none;}

  #guide{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(62%,260px);aspect-ratio:1;border:2.5px solid var(--accent);border-radius:14px;
    box-shadow:0 0 0 2000px rgba(0,0,0,.42);transition:border-color .15s,box-shadow .15s;pointer-events:none;}
  #guide.hit{border-color:#0f0;box-shadow:0 0 0 2000px rgba(0,0,0,.42),0 0 18px 4px rgba(0,255,0,.45);}
  #scanline{position:absolute;left:50%;transform:translateX(-50%);width:min(62%,260px);
    height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation:sweep 1.8s ease-in-out infinite;display:none;pointer-events:none;}
  @keyframes sweep{0%,100%{top:calc(50% - min(31%,130px))}50%{top:calc(50% + min(31%,130px))}}
  #flash{position:absolute;inset:0;background:rgba(0,255,0,.13);opacity:0;pointer-events:none;transition:opacity .08s;}
  #flash.on{opacity:1;}
  #placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#999;font-size:.9rem;}

  .controls{padding:14px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;border-radius:8px;border:none;font-size:.9rem;font-weight:500;cursor:pointer;transition:opacity .15s,transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  #status{font-size:.8rem;color:var(--text2);}
  .hint{font-size:.72rem;color:var(--text2);padding:0 18px 12px;}
  kbd{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:.7rem;}

  #result-box{margin:0 18px 14px;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;display:none;}
  #result-box.show{display:block;animation:fadeIn .2s;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .rl{font-size:.72rem;color:var(--text2);margin-bottom:4px;}
  #rval{font-size:1.05rem;font-weight:700;color:var(--accent);word-break:break-all;}
  #rfmt{font-size:.75rem;color:var(--text2);margin-top:4px;}

  #hist-list{max-height:240px;overflow-y:auto;}
  .empty{padding:24px;text-align:center;color:var(--text2);font-size:.85rem;}
  .hi{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--border);font-size:.87rem;animation:fadeIn .2s;}
  .hi:last-child{border-bottom:none;}
  .badge{font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--accent);color:#fff;white-space:nowrap;flex-shrink:0;}
  .hv{flex:1;word-break:break-all;}
  .ht{font-size:.73rem;color:var(--text2);white-space:nowrap;}
  .hfooter{padding:10px 18px;border-top:1px solid var(--border);display:flex;gap:8px;}

  #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(60px);
    background:#222;color:#fff;padding:10px 22px;border-radius:8px;font-size:.88rem;
    transition:transform .28s;z-index:999;pointer-events:none;}
  #toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header>
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2">
    <rect x="3" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/>
    <rect x="3" y="16" width="5" height="5"/><line x1="16" y1="16" x2="21" y2="16"/>
    <line x1="16" y1="20" x2="21" y2="20"/><line x1="16" y1="16" x2="16" y2="21"/>
  </svg>
  <h1>Code Reader</h1>
</header>

<main>
  <div class="card">
    <div class="card-header">📷 カメラビュー</div>
    <div id="cam-wrap">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
      <div id="guide"></div>
      <div id="scanline"></div>
      <div id="flash"></div>
      <div id="placeholder">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <span>「読み取り開始」でカメラを起動</span>
      </div>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="btn-start">▶ 読み取り開始</button>
      <button class="btn btn-secondary" id="btn-stop" disabled>■ 停止</button>
      <span id="status"></span>
    </div>
    <div class="hint"><kbd>Enter</kbd> 開始　<kbd>Esc</kbd> 停止</div>
    <div id="result-box">
      <div class="rl">読み取り結果</div>
      <div id="rval"></div>
      <div id="rfmt"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">📋 読み取り履歴</div>
    <div id="hist-list"><div class="empty" id="hist-empty">履歴はありません</div></div>
    <div class="hfooter">
      <button class="btn btn-secondary" id="btn-csv" disabled>⬇ CSV出力</button>
      <button class="btn btn-danger" id="btn-clear" disabled>🗑 クリア</button>
    </div>
  </div>
</main>
<div id="toast"></div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', {willReadFrequently:true});
const guide = document.getElementById('guide');
const scanline = document.getElementById('scanline');
const flash = document.getElementById('flash');
const placeholder = document.getElementById('placeholder');
const resultBox = document.getElementById('result-box');
const rval = document.getElementById('rval');
const rfmt = document.getElementById('rfmt');
const histList = document.getElementById('hist-list');
const histEmpty = document.getElementById('hist-empty');
const statusEl = document.getElementById('status');
const btnStart = document.getElementById('btn-start');
const btnStop = document.getElementById('btn-stop');
const btnCsv = document.getElementById('btn-csv');
const btnClear = document.getElementById('btn-clear');

let scanning = false, rafId = null, stream = null;
let history = [], lastVal = '', coolTimer = null;
let quaggaRunning = false;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}
function setStatus(s) { statusEl.textContent = s; }

// ---------- カメラ起動 ----------
async function startCamera() {
  btnStart.disabled = true;
  setStatus('カメラ起動中…');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width:{ideal:1280,min:640}, height:{ideal:720,min:480}, facingMode:'environment' }
    });
    video.srcObject = stream;
    await video.play();
    placeholder.style.display = 'none';
    scanline.style.display = '';
    btnStop.disabled = false;
    scanning = true;
    setStatus('スキャン中…');
    startQRLoop();
    startBarcode();
  } catch(e) {
    toast('カメラへのアクセスができませんでした');
    setStatus('');
    btnStart.disabled = false;
  }
}

// ---------- QRコード（jsQR） ----------
function startQRLoop() {
  function loop() {
    if (!scanning) return;
    if (video.readyState >= 2 && video.videoWidth > 0) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);
      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(img.data, img.width, img.height, {inversionAttempts:'attemptBoth'});
      if (code && code.data) onDetected(code.data, 'QR Code');
    }
    rafId = requestAnimationFrame(loop);
  }
  rafId = requestAnimationFrame(loop);
}

// ---------- バーコード（Quagga2） ----------
function startBarcode() {
  if (typeof Quagga === 'undefined') { toast('バーコードライブラリ読み込み失敗'); return; }
  Quagga.init({
    inputStream: {
      type: 'LiveStream',
      target: video,
      constraints: { width:1280, height:720, facingMode:'environment' },
    },
    decoder: {
      readers: ['ean_reader','ean_8_reader','code_128_reader','code_39_reader',
                'upc_reader','upc_e_reader','itf_reader','codabar_reader'],
      multiple: false,
    },
    locate: true,
    numOfWorkers: 0,
    frequency: 10,
  }, err => {
    if (err) { console.warn('Quagga init error:', err); return; }
    Quagga.start();
    quaggaRunning = true;
  });

  Quagga.onDetected(result => {
    const code = result && result.codeResult;
    if (!code || !code.code) return;
    // 信頼度チェック（誤検出対策）
    const errors = result.codeResult.decodedCodes
      .filter(c => c.error !== undefined)
      .map(c => c.error);
    const avgErr = errors.length ? errors.reduce((a,b)=>a+b,0)/errors.length : 1;
    if (avgErr > 0.25) return;
    onDetected(code.code, code.format);
  });
}

// ---------- 検出共通処理 ----------
function onDetected(val, fmt) {
  if (!scanning) return;
  if (val === lastVal && coolTimer) return;
  lastVal = val;
  clearTimeout(coolTimer);
  coolTimer = setTimeout(() => { lastVal = ''; }, 3000);

  guide.classList.add('hit');
  flash.classList.add('on');
  setTimeout(() => { guide.classList.remove('hit'); flash.classList.remove('on'); }, 350);

  const label = fmt || 'Code';
  resultBox.classList.add('show');
  rval.textContent = val;
  rfmt.textContent = '種別: ' + label;

  const now = new Date();
  history.unshift({ val, label, time: now.toLocaleTimeString('ja-JP'), date: now.toLocaleDateString('ja-JP') });
  renderHistory();
  btnCsv.disabled = false;
  btnClear.disabled = false;
  toast('✅ ' + label + ' を読み取りました');
}

// ---------- 停止 ----------
function stopCamera() {
  scanning = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (quaggaRunning) { try { Quagga.stop(); } catch(e){} quaggaRunning = false; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  placeholder.style.display = '';
  scanline.style.display = 'none';
  btnStart.disabled = false;
  btnStop.disabled = true;
  setStatus('');
}

// ---------- 履歴 ----------
function renderHistory() {
  histEmpty.style.display = history.length ? 'none' : '';
  histList.querySelectorAll('.hi').forEach(e => e.remove());
  history.forEach(h => {
    const d = document.createElement('div');
    d.className = 'hi';
    d.innerHTML = `<span class="badge">${h.label}</span><span class="hv">${esc(h.val)}</span><span class="ht">${h.time}</span>`;
    histList.appendChild(d);
  });
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ---------- CSV ----------
async function exportCSV() {
  const rows = history.map((h,i) => `${i+1},"${h.label}","${h.val.replace(/"/g,'""')}","${h.time}","${h.date}"`);
  const blob = new Blob(['\uFEFFNo,種別,内容,時刻,日付\n'+rows.join('\n')], {type:'text/csv'});
  const name = `scan_${new Date().toISOString().slice(0,10)}.csv`;
  if ('showSaveFilePicker' in window) {
    try {
      const fh = await window.showSaveFilePicker({suggestedName:name,types:[{description:'CSV',accept:{'text/csv':['.csv']}}]});
      const w = await fh.createWritable(); await w.write(blob); await w.close();
      toast('CSVを保存しました'); return;
    } catch(e) { if(e.name==='AbortError') return; }
  }
  const a = Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:name});
  a.click(); toast('CSVをダウンロードしました');
}

// ---------- イベント ----------
btnStart.addEventListener('click', startCamera);
btnStop.addEventListener('click', stopCamera);
btnCsv.addEventListener('click', exportCSV);
btnClear.addEventListener('click', () => {
  history = []; lastVal = '';
  resultBox.classList.remove('show');
  renderHistory();
  btnCsv.disabled = true; btnClear.disabled = true;
  toast('履歴をクリアしました');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !scanning) startCamera();
  if (e.key === 'Escape' && scanning) stopCamera();
});
</script>
</body>
</html>
