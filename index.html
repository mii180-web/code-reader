<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0078d4">
<title>Code Reader</title>
<style>
  :root {
    --bg: #f3f3f3;
    --surface: rgba(255,255,255,0.7);
    --surface2: rgba(255,255,255,0.5);
    --border: rgba(0,0,0,0.08);
    --text: #1a1a1a;
    --text2: #555;
    --accent: #0078d4;
    --accent-h: #106ebe;
    --danger: #d13438;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #202020;
      --surface: rgba(40,40,40,0.8);
      --surface2: rgba(50,50,50,0.6);
      --border: rgba(255,255,255,0.08);
      --text: #f3f3f3;
      --text2: #aaa;
      --accent: #60cdff;
      --accent-h: #4ac7f5;
      --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--surface); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 1.1rem; font-weight: 600; }
  main { flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 20px; max-width: 760px; width: 100%; margin: 0 auto; }
  .card { background: var(--surface); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .card-header { padding: 14px 18px; font-size: 0.85rem; font-weight: 600; color: var(--text2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  #camera-wrap { position: relative; background: #000; aspect-ratio: 16/9; overflow: hidden; }
  #video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scan-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .scan-frame { width: min(65%, 260px); aspect-ratio: 1; border: 2.5px solid var(--accent); border-radius: 16px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.35); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
  .scan-line { position: absolute; width: min(65%, 260px); height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); animation: scan 2s linear infinite; }
  @keyframes scan { 0%{top:calc(50% - min(32.5%,130px))} 100%{top:calc(50% + min(32.5%,130px))} }
  #placeholder { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #aaa; font-size: 0.9rem; }
  .controls { padding: 14px 18px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 8px; border: none; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: background 0.15s, transform 0.1s; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-h); }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #status-msg { font-size: 0.8rem; color: var(--text2); margin-left: 4px; }
  #result-box { margin: 0 18px 14px; padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; display: none; }
  #result-box.show { display: block; }
  .result-label { font-size: 0.75rem; color: var(--text2); margin-bottom: 4px; }
  #result-text { font-size: 1rem; font-weight: 600; word-break: break-all; color: var(--accent); }
  #result-type { font-size: 0.75rem; color: var(--text2); margin-top: 4px; }
  #history-list { max-height: 260px; overflow-y: auto; }
  .history-empty { padding: 24px; text-align: center; color: var(--text2); font-size: 0.85rem; }
  .history-item { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--border); font-size: 0.88rem; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
  .history-item:last-child { border-bottom: none; }
  .history-badge { font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 20px; background: var(--accent); color: #fff; white-space: nowrap; flex-shrink: 0; }
  .history-value { flex: 1; word-break: break-all; }
  .history-time { font-size: 0.75rem; color: var(--text2); white-space: nowrap; }
  .history-footer { padding: 10px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #333; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 0.88rem; transition: transform 0.3s; z-index: 100; pointer-events: none; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  .hint { font-size: 0.72rem; color: var(--text2); padding: 4px 18px 12px; }
  kbd { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 0.7rem; }
</style>
</head>
<body>
<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><rect x="3" y="3" width="5" height="5"/><rect x="16" y="3" width="5" height="5"/><rect x="3" y="16" width="5" height="5"/><line x1="21" y1="16" x2="21" y2="21"/><line x1="16" y1="21" x2="21" y2="21"/><line x1="9" y1="3" x2="9" y2="9"/><line x1="3" y1="9" x2="9" y2="9"/></svg>
  <h1>Code Reader</h1>
</header>
<main>
  <div class="card">
    <div class="card-header">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      カメラビュー
    </div>
    <div id="camera-wrap">
      <video id="video" autoplay muted playsinline></video>
      <div class="scan-overlay">
        <div class="scan-frame"></div>
        <div class="scan-line" id="scan-line" style="display:none"></div>
      </div>
      <div id="placeholder">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        <span>「読み取り開始」でカメラを起動</span>
      </div>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="btn-start">▶ 読み取り開始</button>
      <button class="btn btn-secondary" id="btn-stop" disabled>■ 停止</button>
      <span id="status-msg"></span>
    </div>
    <div class="hint"><kbd>Enter</kbd> 開始 &nbsp; <kbd>Esc</kbd> 停止</div>
    <div id="result-box">
      <div class="result-label">読み取り結果</div>
      <div id="result-text"></div>
      <div id="result-type"></div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">📋 読み取り履歴</div>
    <div id="history-list">
      <div class="history-empty" id="history-empty">履歴はありません</div>
    </div>
    <div class="history-footer">
      <button class="btn btn-secondary" id="btn-csv" disabled>⬇ CSVエクスポート</button>
      <button class="btn btn-danger" id="btn-clear" disabled>🗑 クリア</button>
    </div>
  </div>
</main>
<div id="toast"></div>

<script type="module">
import { BrowserMultiFormatReader, NotFoundException } from 'https://esm.sh/@zxing/library@0.20.0';

const video = document.getElementById('video');
const btnStart = document.getElementById('btn-start');
const btnStop = document.getElementById('btn-stop');
const btnCsv = document.getElementById('btn-csv');
const btnClear = document.getElementById('btn-clear');
const resultBox = document.getElementById('result-box');
const resultText = document.getElementById('result-text');
const resultType = document.getElementById('result-type');
const historyList = document.getElementById('history-list');
const historyEmpty = document.getElementById('history-empty');
const placeholder = document.getElementById('placeholder');
const scanLine = document.getElementById('scan-line');
const statusMsg = document.getElementById('status-msg');

let history = [];
let reader = null;
let scanning = false;
let lastCode = '';
let cooldown = false;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function setStatus(msg) { statusMsg.textContent = msg; }

async function startCamera() {
  setStatus('カメラを起動中…');
  btnStart.disabled = true;
  try {
    reader = new BrowserMultiFormatReader();
    const devices = await BrowserMultiFormatReader.listVideoInputDevices();
    if (!devices.length) { toast('カメラが見つかりません'); btnStart.disabled = false; return; }

    // 高解像度優先で選択
    const deviceId = devices[devices.length - 1].deviceId;

    await reader.decodeFromVideoDevice(deviceId, video, (result, err) => {
      if (result && !cooldown && result.getText() !== lastCode) {
        lastCode = result.getText();
        cooldown = true;
        setTimeout(() => { cooldown = false; lastCode = ''; }, 2500);
        onDetected(result.getText(), result.getBarcodeFormat());
      }
    });

    // 高解像度を再設定
    const stream = video.srcObject;
    if (stream) {
      const track = stream.getVideoTracks()[0];
      await track.applyConstraints({ width: { ideal: 1280 }, height: { ideal: 720 } });
    }

    placeholder.style.display = 'none';
    scanLine.style.display = '';
    scanning = true;
    btnStop.disabled = false;
    setStatus('スキャン中…');
  } catch(e) {
    toast('カメラへのアクセスが拒否されました');
    setStatus('');
    btnStart.disabled = false;
  }
}

function stopCamera() {
  if (reader) { reader.reset(); reader = null; }
  video.srcObject = null;
  scanning = false;
  placeholder.style.display = '';
  scanLine.style.display = 'none';
  btnStart.disabled = false;
  btnStop.disabled = true;
  setStatus('');
}

// ZXingのフォーマット名を日本語に
const formatLabel = f => {
  const m = {
    QR_CODE:'QR Code', EAN_13:'EAN-13', EAN_8:'EAN-8',
    CODE_128:'Code 128', CODE_39:'Code 39', ITF:'ITF',
    DATA_MATRIX:'Data Matrix', PDF_417:'PDF417',
    UPC_A:'UPC-A', UPC_E:'UPC-E', AZTEC:'Aztec',
  };
  const k = String(f);
  return m[k] || k;
};

function onDetected(value, format) {
  const label = formatLabel(format);
  resultBox.classList.add('show');
  resultText.textContent = value;
  resultType.textContent = `種別: ${label}`;

  const now = new Date();
  history.unshift({ value, type: label, time: now.toLocaleTimeString('ja-JP'), date: now.toLocaleDateString('ja-JP') });
  renderHistory();
  btnCsv.disabled = false;
  btnClear.disabled = false;
  toast(`✅ ${label} を読み取りました`);
}

function renderHistory() {
  historyEmpty.style.display = history.length ? 'none' : '';
  historyList.querySelectorAll('.history-item').forEach(e => e.remove());
  history.forEach(h => {
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `<span class="history-badge">${h.type}</span><span class="history-value">${esc(h.value)}</span><span class="history-time">${h.time}</span>`;
    historyList.appendChild(div);
  });
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function exportCSV() {
  const header = 'No,種別,内容,時刻,日付\n';
  const rows = history.map((h,i) => `${i+1},"${h.type}","${h.value.replace(/"/g,'""')}","${h.time}","${h.date}"`).join('\n');
  const blob = new Blob(['\uFEFF'+header+rows], { type: 'text/csv' });
  if ('showSaveFilePicker' in window) {
    try {
      const fh = await window.showSaveFilePicker({ suggestedName: `scan_${new Date().toISOString().slice(0,10)}.csv`, types:[{description:'CSV',accept:{'text/csv':['.csv']}}] });
      const w = await fh.createWritable(); await w.write(blob); await w.close();
      toast('CSVを保存しました'); return;
    } catch(e) { if(e.name==='AbortError') return; }
  }
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `scan_${new Date().toISOString().slice(0,10)}.csv` });
  a.click(); URL.revokeObjectURL(a.href);
  toast('CSVをダウンロードしました');
}

btnStart.addEventListener('click', startCamera);
btnStop.addEventListener('click', stopCamera);
btnCsv.addEventListener('click', exportCSV);
btnClear.addEventListener('click', () => {
  history = []; lastCode = '';
  resultBox.classList.remove('show');
  renderHistory();
  btnCsv.disabled = true; btnClear.disabled = true;
  toast('履歴をクリアしました');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !scanning) startCamera();
  if (e.key === 'Escape' && scanning) stopCamera();
});
</script>
</body>
</html>
